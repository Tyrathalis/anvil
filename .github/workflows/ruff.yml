name: Ruff

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # pinned 10-20: `python-version-file` resolved requires-python >=3.11 to the runners' new 3.15.0, which torch 2.12.1 has no wheel for (the box runs 3.14)

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Run ruff check
        run: uv run ruff check anvil scripts tests

