name: Pyright

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  pyright:
    runs-on: ubuntu-latest
    # Non-blocking until the D3-era typing sweep lands (105 findings on the
    # un-swept tree); flip to enforcing with that sweep.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Run pyright
        run: uv run pyright anvil scripts tests
