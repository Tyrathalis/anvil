[project]
name = "anvil"
version = "0.0.1"
description = "A neural agent for Magic: The Gathering built on the Forge rules engine"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "grpcio>=1.81.1",
    "grpcio-tools>=1.81.1",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "protobuf>=6.33.6",
    "safetensors>=0.8.0",
    "sentence-transformers>=5.6.0",
    "torch>=2.12.1",
    "zstandard>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anvil"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Modest green-now set (Talor-A's CI adapted, anvil#4): pyflakes + pycodestyle
# errors + import sort. The extended set (SIM/BLE/B/DTZ/...) and ruff-format
# enforcement land with the D3-era mechanical sweep, reviewed as a unit.
select = ["E4", "E7", "E9", "F", "I"]
# E741 (ambiguous single-letter names) and E731 (lambda assignment) are
# in-codebase style choices; revisit with the D3-era sweep.
ignore = ["E741", "E731"]

[tool.ruff.lint.per-file-ignores]
"anvil/**/__init__.py" = ["F401"] # re-exports
"anvil/bridge/pb/*" = ["ALL"]     # generated + grpc-stub hand-fix, never lint

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyright>=1.1.400",
    "ruff>=0.16.0",
]
